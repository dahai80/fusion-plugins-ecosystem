[project]
name = "fusion-plugins-ecosystem"
version = "0.12.0"
description = "Fusion plugin ecosystem — plugin registry, lifecycle manager, MCP server, and Claude full-chain adaptation layer on top of fusion-cowork"
readme = "README.md"
authors = [
    { name = "Fusion-MLX Team" },
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fusion-core>=0.12.1",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "setproctitle>=1.3.0",
    "jsonschema>=4.21.0",
]

[project.scripts]
fusion-plugin-server = "fusion_plugins_ecosystem.server:main"
fusion-plugin-console = "fusion_plugins_ecosystem.console_app:main"

[project.optional-dependencies]
cowork = [
    "fusion-cowork>=0.1.0",
]
console = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
]
dev = [
    "fusion-plugins-ecosystem[test,cowork]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_plugins_ecosystem*"]

# PyPI/homebrew distribution (issue #72): runtime package data must ship in
# the wheel + sdist — startup tool-manifest validation and the console GUI
# read these from Path(__file__).
[tool.setuptools.package-data]
fusion_plugins_ecosystem = [
    "builtin/*.json",
    "web/*",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
