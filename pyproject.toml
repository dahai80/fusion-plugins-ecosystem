[project]
name = "fusion-plugins-ecosystem"
version = "0.3.1"
description = "Fusion 插件生态 — 基于 fusion-desk 的标准化插件注册中心、生命周期管理、Claude 全链路适配"
authors = [
    { name = "Fusion-MLX Team" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
fusion-plugin-server = "fusion_plugins_ecosystem.server:main"

[project.optional-dependencies]
desk = [
    "fusion-desk>=0.1.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]
dev = [
    "fusion-plugins-ecosystem[test,desk]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_plugins_ecosystem*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
