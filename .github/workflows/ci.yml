name: CI

on:
  push:
    branches: [main, "audit/*", "feat/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]  # fusion-core requires >=3.12 (issue #38)
    steps:
      - uses: actions/checkout@v4
      # issue #38：依赖 in-tree fusion-core（单点配置解析），CI 需先装
      - uses: actions/checkout@v4
        with:
          repository: dahai80/fusion-core
          path: fusion-core
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./fusion-core
          pip install -e ".[test]"
      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=120

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff
      - name: Ruff check
        run: ruff check fusion_plugins_ecosystem/ tests/ --select=F,E711,E712,E721,E741,W
      - name: Ruff format check
        run: ruff format --check fusion_plugins_ecosystem/ tests/
