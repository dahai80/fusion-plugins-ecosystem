name: publish-artifacts

# Issue #76: build plugin/connector packages and upload them to the unified
# fusion-skills release (registry-artifacts tag). Manual for now — the registry
# PR is prepared locally with scripts/publish_artifacts.py (build → validate →
# upload → PR checklist). Requires repository secret FUSION_SKILLS_TOKEN
# (PAT with contents:write on dahai80/fusion-skills); the upload step skips
# itself if the secret is absent.
on:
  workflow_dispatch:

concurrency:
  group: publish-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      FUSION_SKILLS_TOKEN: ${{ secrets.FUSION_SKILLS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Build artifacts
        run: python scripts/publish_artifacts.py build --out dist/artifacts
      - name: Validate artifact pins against dist
        run: |
          curl -sL -o /tmp/registry.json \
            https://raw.githubusercontent.com/dahai80/fusion-skills/main/registry.json
          python scripts/publish_artifacts.py validate \
            --registry /tmp/registry.json --dist dist/artifacts
      - name: Upload to the unified fusion-skills release
        if: env.FUSION_SKILLS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.FUSION_SKILLS_TOKEN }}
        run: |
          gh release view registry-artifacts --repo dahai80/fusion-skills || \
            gh release create registry-artifacts --repo dahai80/fusion-skills \
              --title "Registry artifacts" \
              --notes "Installable plugin/connector packages pinned by registry.json (issue fusion-plugins-ecosystem#76)"
          python scripts/publish_artifacts.py upload \
            --dist dist/artifacts --repo dahai80/fusion-skills --tag registry-artifacts
