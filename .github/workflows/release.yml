name: release

# Issue #72: tag push -> test -> build -> publish to PyPI via trusted
# publishing + sync the Homebrew formula to dahai80/homebrew-fusion-mlx.
# Prerequisites (one-time, manual):
#   PyPI: register the trusted publisher at
#     https://pypi.org/manage/account/publishing/ —
#     owner: dahai80, repository: fusion-plugins-ecosystem,
#     workflow filename: release.yml, environment: pypi
#   Homebrew: repository secret HOMEBREW_TAP_TOKEN (PAT with push access to
#     the tap repo) — the formula-sync job skips itself if it is absent.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, skip the PyPI upload"
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Installs the package the way a PyPI consumer would (non-editable, deps
    # resolved from PyPI incl. fusion-core>=0.12.1) — validates packaging,
    # package-data inclusion, and the published dependency graph in one shot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[test,console]" ruff
      - run: ruff check fusion_plugins_ecosystem/ tests/ --select=F,E711,E712,E721,E741,W
      - run: ruff format --check fusion_plugins_ecosystem/ tests/
      - run: pytest tests/ -q --timeout=120

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Dry-run dispatches stop after build; tag pushes always publish.
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing requires id-token: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  update-homebrew:
    needs: build
    runs-on: macos-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula checksums
        run: |
          chmod +x homebrew-tap/update_checksums.sh
          ./homebrew-tap/update_checksums.sh "${{ steps.version.outputs.version }}"
      - name: Push updated formula to Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/dahai80/homebrew-fusion-mlx.git /tmp/tap
          cp homebrew-tap/Formula/fusion-plugins-ecosystem.rb /tmp/tap/Formula/fusion-plugins-ecosystem.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fusion-plugins-ecosystem.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update fusion-plugins-ecosystem for v${{ steps.version.outputs.version }}"
          git push
